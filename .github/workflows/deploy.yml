name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']  # 监听 main 分支推送
  schedule:
    - cron: "0 2 * * *"  # 每日 UTC 2 点自动部署（北京时间 10 点）
  workflow_dispatch:  # 允许手动触发部署

permissions:
  contents: read       # 仅读取代码权限
  pages: write         # 写入 Pages 资源权限
  id-token: write      # 生成身份令牌权限

concurrency:
  group: 'pages'
  cancel-in-progress: true  # 取消正在进行的旧部署任务

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}  # 输出部署后的页面 URL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史，确保构建时能获取版本信息

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 匹配 Vite 推荐的 Node 版本
          cache: 'npm'
          cache-dependency-path: package-lock.json  # 显式指定锁文件路径

      - name: Install dependencies
        run: npm ci  # 严格按照 package-lock.json 安装依赖

      - name: Build project
        run: npm run build-only  # 使用项目中实际的构建命令
        env:
          NODE_ENV: production
          # 可根据需要添加项目所需的环境变量
          # VITE_APP_BASE_URL: ${{ github.event.repository.html_url }}

      - name: Verify build output
        run: |
          if [ ! -d "./dist" ]; then
            echo "Error: Build directory './dist' does not exist!"
            exit 1
          fi
          if [ ! -f "./dist/index.html" ]; then
            echo "Error: Entry file 'index.html' missing in './dist'!"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'  # Vite 构建输出目录

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
